# 用 xcodegen 產生 Xcode 專案：cd ios && xcodegen
name: CarKaraoke
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CarKaraoke:
    type: application
    platform: iOS
    sources:
      - path: CarKaraoke
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: CarKaraoke
        # 請改成自己的 Bundle ID（例如 com.你的名字.carkaraoke）；免費 Apple ID 若顯示「已被使用」，把最後一段改成別的英文字
        PRODUCT_BUNDLE_IDENTIFIER: com.example.carkaraoke
        INFOPLIST_FILE: CarKaraoke/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        # 接住音訊引擎的 Objective-C 例外（ObjCException.m），避免閃退
        SWIFT_OBJC_BRIDGING_HEADER: CarKaraoke/CarKaraoke-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""  # 填自己的 Apple ID 的 Team ID（也可以之後在 Xcode 的 Signing & Capabilities 選 Team）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets:
        - CarKaraokeTests
  # 手機去人聲的自動測試（在模擬器跑：xcodebuild test -scheme CarKaraoke -destination 'platform=iOS Simulator,name=iPhone 17'）
  CarKaraokeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CarKaraokeTests
    dependencies:
      - target: CarKaraoke
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.carkaraoke.tests
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
